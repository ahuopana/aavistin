name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aavistin
          POSTGRES_PASSWORD: aavistin
          POSTGRES_DB: aavistin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aavistin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aavistin:aavistin@localhost:5432/aavistin

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Django system checks
        run: uv run manage.py check

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest
