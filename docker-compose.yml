services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aavistin
      POSTGRES_PASSWORD: aavistin
      POSTGRES_DB: aavistin
    ports:
      - "5432:5432"
    volumes:
      - aavistin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aavistin"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: aavistin:dev
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_dev_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - aavistin_venv:/app/.venv
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aavistin:aavistin@db:5432/aavistin
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (docs/adr/0007-background-job-backend.md): worker
  # processes tasks enqueued to the Postgres-backed queue; scheduler
  # enqueues the periodic ones (e.g. staleness recompute) on an
  # interval. Neither needs its own service beyond Postgres.
  worker:
    image: aavistin:dev
    build: .
    command: sh -c "python manage.py migrate && python manage.py db_worker"
    volumes:
      - .:/app
      - aavistin_venv:/app/.venv
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aavistin:aavistin@db:5432/aavistin
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: aavistin:dev
    build: .
    command: python manage.py scheduler
    volumes:
      - .:/app
      - aavistin_venv:/app/.venv
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aavistin:aavistin@db:5432/aavistin
    depends_on:
      db:
        condition: service_healthy

volumes:
  aavistin_pgdata:
  # Named volume for /app/.venv on services that bind-mount the project
  # root: this keeps the image's build-time venv from being shadowed by
  # the host checkout (which has no .venv), instead of shipping uv into
  # the runtime image just to rebuild it there. web/worker/scheduler all
  # share this volume, which only gets copy-up-populated from whichever
  # container mounts it first — safe here only because all three also
  # share one `image:` tag (above), so Compose builds the image once and
  # every container's /app/.venv is guaranteed identical.
  aavistin_venv:
