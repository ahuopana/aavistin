services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aavistin
      POSTGRES_PASSWORD: aavistin
      POSTGRES_DB: aavistin
    ports:
      - "5432:5432"
    volumes:
      - aavistin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aavistin"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - aavistin_uv_cache:/root/.cache/uv
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aavistin:aavistin@db:5432/aavistin
    depends_on:
      db:
        condition: service_healthy

volumes:
  aavistin_pgdata:
  # uv's package cache, shared across services that bind-mount the
  # project root over /app: that mount shadows the image's baked-in
  # /app/.venv, but `uv run` (see the compose commands above) re-syncs
  # a correct venv from uv.lock on every container start regardless.
  # This volume just makes repeat syncs fast — it never needs manual
  # invalidation the way a venv-holding volume would after a dependency
  # change, since it's an additive download cache, not the venv itself.
  aavistin_uv_cache:
