{% extends "base.html" %}

{% block title %}Sign in · Aavistin{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  {% if form.errors %}
    <p class="message message-error">Incorrect username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_username">Username</label><br>
      <input type="text" name="username" id="id_username" autofocus required>
    </p>
    <p>
      <label for="id_password">Password</label><br>
      <input type="password" name="password" id="id_password" required>
    </p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
